<div class="course-organizer">
  @if (!courseService.hasSelectedPlan()) {
    <app-no-plan-selected
      title="Plan de Cursada no disponible"
      description="Seleccioná un plan de estudio del catálogo o cargá un plan de demostración para organizar tus materias, registrar tu avance académico y consultar correlatividades."
    />
  } @else {
    <div class="header app-page-header">
      <div class="header-title-group">
        <h1 class="app-page-title">Plan de Cursada</h1>
        <p class="subtitle app-page-subtitle">Gestioná el estado de tus materias y consultá correlatividades</p>
      </div>
      <div class="header-actions">
        <div class="progress-badge">
          <span class="progress-text">Avance: {{ progressPercent() }}% ({{ approvedCount() }}/{{ totalCount() }} materias)</span>
          <mat-progress-bar mode="determinate" [value]="progressPercent()" class="mat-progress-bar-custom"></mat-progress-bar>
        </div>
        <button mat-stroked-button color="warn" class="reset-btn" (click)="onReset()" title="Reiniciar progreso">
          <mat-icon>refresh</mat-icon>
          <span>Reiniciar</span>
        </button>
      </div>
    </div>

    <app-course-organizer-legend />

    <app-course-grid
      [courses]="courseService.courses()"
      [selectedIds]="courseService.selectedIds()"
      (cardClicked)="onCourseCardClicked($event)"
      (changeLessonClicked)="onChangeLessonRequested($event)"
      (mouseEntered)="onMouseEntered($event)"
      (mouseLeft)="onMouseLeft()"
    />

    <app-lesson-selector-modal
      [course]="selectedCourseForModal()"
      [isOpen]="isModalOpen()"
      (closed)="closeModal()"
      (lessonSelected)="onLessonSelected($event)"
    />
  }
</div>
