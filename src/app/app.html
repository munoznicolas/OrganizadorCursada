<mat-toolbar class="main-toolbar">
  <button
    mat-icon-button
    (click)="isOpen.update(v => !v)"
    aria-label="Alternar menú de navegación"
    [attr.aria-expanded]="isOpen()"
  >
    <mat-icon aria-hidden="true">menu</mat-icon>
  </button>
  <span class="app-brand-title">OrganizadorCursada</span>
  <span class="breadcrumb-separator" aria-hidden="true">/</span>
  <app-career-selector (openWorkshop)="openWorkshop()" />

  <span class="toolbar-spacer"></span>

  <app-user-menu />
</mat-toolbar>

<mat-sidenav-container class="app-container" (backdropClick)="isOpen.set(false)">
  <mat-sidenav [mode]="isMobile() ? 'over' : 'side'" [opened]="isOpen()">
    <app-sidebar (navigate)="onSidebarNavigate()" />
  </mat-sidenav>
  <mat-sidenav-content role="main">
    <div class="wrap">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
<app-toast-container />

<!-- Plan Diff Viewer Modal -->
@if (showDiffViewer()) {
  <app-plan-diff-viewer
    (closeModal)="showDiffViewer.set(false)"
    (applyChanges)="showDiffViewer.set(false)"
  />
}
